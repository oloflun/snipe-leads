# Render Blueprint — VILANDE. Stacken kör på Railway (se RAILWAY.md).
#
# ## Läs det här innan du väcker filen
#
# Den här blueprinten deklarerade `LLM_PROVIDER: deepseek` för båda tjänsterna.
# Tjänsterna var aldrig avstängda när flytten till Railway gjordes, och de
# fortsatte auto-deploya från `main` och `development`. 2026-08-24 upptäcktes
# att de körde `provider=deepseek` mot `storage: postgres` — alltså en riktig
# databas — vid en tidpunkt då hela dataskyddsarbetet utgick från att DeepSeek
# var utfasat. Se docs/JURIDIK_ATGARDER.md, P0.2b.
#
# DeepSeek är därför borttagen härifrån. Utan providernyckel startar tjänsten i
# SIMULERINGSLÄGE: deterministiska svenska svar, inga API-anrop, ingen
# överföring någonstans. Det är rätt viloläge för en stack ingen använder.
#
# Ska Render tas i bruk igen: välj provider MEDVETET, och läs
# `Settings.llm_provider_fault()` först — den vägrar starta med DeepSeek så
# fort DATABASE_URL pekar på något annat än loopback, oavsett vilken värd som
# kör processen.
#
# Ska Render inte tas i bruk igen: radera tjänsterna i dashboarden och den här
# filen. En blueprint som ligger kvar är en tjänst som kan återuppstå.
#
# sync:false = värdet sätts utifrån.
#
# TVÅ TJÄNSTER, TVÅ GRENAR:
#   snajp-support      ← main         (produktion)
#   snajp-support-dev  ← development  (preview)
#
# `branch:` står nu i git och inte bara i dashboarden. Det är inte kosmetik:
# grenvalet var ett osynligt dashboardfält, och två produktionsincidenter kom ur
# att det pekade fel utan att synas i någon diff. Samma klass av fel som Root
# Directory, som återgått till `snajp-support` av sig självt och fällt ett
# Docker-bygge med `"/agent-core": not found`.
#
# KVOTEN: gratisnivån ger 750 instanstimmar/månad delat på ALLA gratistjänster i
# workspacet. keep-backend-awake.yml pingar därför bara PRODUKTIONEN (~250 h/mån).
# Två varma tjänster hade landat på ~500 h, och när taket spricker stänger Render
# av allt till nästa månad. Previewen får en minuts kallstart — rätt avvägning
# för en testmiljö.
services:
  - type: web
    name: snajp-support
    runtime: docker
    branch: main
    # rootDir MÅSTE vara repo-roten: agent-core/ ligger utanför snajp-support/
    # och Docker kan inte COPY:a utanför byggkontexten. Med rootDir:
    # snajp-support startade containern grönt och föll först på det första
    # riktiga agentanropet (UnknownSkillError). Se Dockerfile + .dockerignore.
    rootDir: .
    dockerfilePath: ./snajp-support/Dockerfile
    healthCheckPath: /health/live
    plan: free
    envVars:
      # INGEN LLM_PROVIDER och ingen providernyckel. Utan dem kör tjänsten i
      # simuleringsläge, vilket är det enda säkra viloläget — se filhuvudet.
      # Att sätta en provider här är ett beslut, inte en default.
      # Administrativ nyckel (skapa tenants/nycklar). Slumpas av Render så den
      # aldrig faller tillbaka på den publika platshållaren i config.py.
      - key: SNAJP_MASTER_API_KEY
        generateValue: true
      # Demo-nyckel för default-tenanten. Medvetet publik — samma värde är redan
      # fallback i app/api/snajp-support/_lib.ts, så frontend och backend matchar
      # utan extra konfiguration.
      - key: SNAJP_DEMO_API_KEY
        value: snajp_demo_2f8c1a9e4b7d
      # Valfritt — persistens (Supabase pooler):
      - key: DATABASE_URL
        sync: false
      # Gemini (gratisnivå) — driver vision-sidovagnen (G9) och embeddings.
      # Utan den: ingen bildbeskrivning, KB använder fulltextsökning i stället
      # för vektorsökning. Skaffa nyckel: https://aistudio.google.com/apikey
      - key: GEMINI_API_KEY
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      # Email-pipeline. Polling av (0) tills en riktig inkorg kopplas.
      - key: INBOX_POLL_SECONDS
        value: "0"
      - key: AUTO_SEND_MIN_CONFIDENCE
        value: "0.75"
      # IMAP (Gmail/Outlook) — sätts när en inkorg ska kopplas.
      - key: IMAP_HOST
        sync: false
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASSWORD
        sync: false
      - key: IMAP_FOLDER
        value: INBOX

  # --- Preview: samma image, egen gren, egen databas -----------------------
  #
  # Skild från produktionen på de tre punkter som faktiskt spelar roll:
  # DATABASE_URL pekar på preview-Supabase-projektet, masternyckeln slumpas
  # separat, och demo-nyckeln är EN ANNAN. Att dela demo-nyckel hade betytt att
  # en preview-frontend kunde tala med produktionsbackenden utan att någon
  # märkte det — precis den sortens tysta korskoppling som gör att "det funkade
  # i preview" slutar betyda något.
  - type: web
    name: snajp-support-dev
    runtime: docker
    branch: development
    # Samma som produktionen och av samma tvingande skäl: agent-core/ ligger
    # utanför snajp-support/ och kan inte COPY:as om kontexten är undermappen.
    rootDir: .
    dockerfilePath: ./snajp-support/Dockerfile
    healthCheckPath: /health/live
    plan: free
    envVars:
      # INGEN LLM_PROVIDER och ingen providernyckel. Utan dem kör tjänsten i
      # simuleringsläge, vilket är det enda säkra viloläget — se filhuvudet.
      # Att sätta en provider här är ett beslut, inte en default.
      # Egen masternyckel. Delad hade gjort produktionens /api/admin nåbar med
      # previewens nyckel.
      - key: SNAJP_MASTER_API_KEY
        generateValue: true
      # Egen demo-nyckel, INTE produktionens publika värde.
      - key: SNAJP_DEMO_API_KEY
        generateValue: true
      # Preview-Supabase-projektet, som snajp_app-rollen. Previewen är rätt
      # ställe att köra utan BYPASSRLS: då prövas RLS skarpt innan produktionen
      # byter roll (INV-SEC-001).
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: INBOX_POLL_SECONDS
        value: "0"
      - key: AUTO_SEND_MIN_CONFIDENCE
        value: "0.75"
      - key: IMAP_HOST
        sync: false
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASSWORD
        sync: false
      - key: IMAP_FOLDER
        value: INBOX
