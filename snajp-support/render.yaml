# Render Blueprint — auto-deploy av Snajp-Support-backenden från GitHub.
# Peka Render på denna fil (Blueprint). sync:false = värdet sätts i dashboarden.
#
# Deployen fungerar UTAN att något hemligt sätts: saknas DEEPSEEK_API_KEY kör
# tjänsten i simuleringsläge (deterministiska svenska svar, inga API-kostnader).
# Lägg till nyckeln när demon ska drivas av riktig AI.
services:
  - type: web
    name: snajp-support
    runtime: docker
    rootDir: snajp-support
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/live
    plan: free
    envVars:
      - key: LLM_PROVIDER
        value: deepseek
      - key: MODEL
        value: deepseek-chat
      # Utan värde => simuleringsläge. Sätt för riktig AI.
      - key: DEEPSEEK_API_KEY
        sync: false
      # Administrativ nyckel (skapa tenants/nycklar). Slumpas av Render så den
      # aldrig faller tillbaka på den publika platshållaren i config.py.
      - key: SNAJP_MASTER_API_KEY
        generateValue: true
      # Demo-nyckel för default-tenanten. Medvetet publik — samma värde är redan
      # fallback i app/api/snajp-support/_lib.ts, så frontend och backend matchar
      # utan extra konfiguration.
      - key: SNAJP_DEMO_API_KEY
        value: snajp_demo_2f8c1a9e4b7d
      # Valfritt — persistens (Supabase pooler) och embeddings (OpenAI-nyckel):
      - key: DATABASE_URL
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      # Email-pipeline. Polling av (0) tills en riktig inkorg kopplas.
      - key: INBOX_POLL_SECONDS
        value: "0"
      - key: AUTO_SEND_MIN_CONFIDENCE
        value: "0.75"
      # IMAP (Gmail/Outlook) — sätts i dashboarden när en inkorg ska kopplas.
      - key: IMAP_HOST
        sync: false
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASSWORD
        sync: false
      - key: IMAP_FOLDER
        value: INBOX
