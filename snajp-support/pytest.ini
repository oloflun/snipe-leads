[pytest]
# CI kör `pytest` utan sökväg från den här katalogen (.github/workflows/verify.yml).
# I en ren checkout finns bara tests/, men lokalt ligger ofta gitignorerade
# leveranskopior kvar — backend/, frontend/ och databas/ är dubbletter av
# källkoden, inte källkod. Utan uteslutningen kolliderar backend/tests/conftest.py
# med tests/conftest.py och hela sviten faller vid collection med
# ImportPathMismatchError, trots att inget är fel i koden.
#
# Samma resonemang som exkluderingen av snajp-support/frontend i tsconfig.json.
testpaths = tests
norecursedirs = backend frontend databas .venv .git __pycache__
