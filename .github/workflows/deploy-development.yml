name: Deploy — Development

# Railways deployment trigger för development-miljön lyssnar på grenen
# `railway-development`, INTE `development` (se DEPLOY.md). Den här workflowen
# gör den andra, manuella pushen automatiskt — mirror:ar development till
# railway-development på varje push, vilket utlöser Railways riktiga deploy.
#
# Tidigare deployade den här filen till Vercel (den döda kedjan — se DEPLOY.md
# "Den döda kedjan": Vercel-previewen läser en Supabase-gren i
# MIGRATIONS_FAILED och når aldrig produkten). Bytt 2026-08-25 på uttrycklig
# begäran: push till development ska trigga Railway development, inte Vercel.

on:
  push:
    branches:
      - development

jobs:
  mirror-to-railway:
    name: Mirror to railway-development
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Push development -> railway-development
        run: git push origin HEAD:railway-development
