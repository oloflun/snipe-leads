name: Verify

on:
  pull_request:
  push:
    branches:
      # Arbetsgrenarna.
      - development
      - main
      # DEPLOYGRENEN för produktion. Development deployar sedan 2026-08-27
      # direkt från grenen development (Railways trigger omlagd, se DEPLOY.md),
      # så railway-development är död och borttagen ur listan 2026-08-29.
      # railway-main är däremot fortfarande den gren produktionen byggs från,
      # och den ska stå kvar här tills main-cutovern är gjord.
      #
      # Historiken som motiverar raden: 2026-08-24 deployade fyra commits i
      # rad medan Verify var rött, eftersom rödheten satt på en gren som ingen
      # deploy läste. Bokföringschattens tur två var trasig i drift med grön
      # dev-maskin.
      #
      # LÄS DET HÄR INNAN DU LITAR PÅ DEN: det här är DETEKTION, inte en
      # grind. Railway bygger på push och väntar inte på GitHub Actions, så en
      # röd Verify stoppar fortfarande ingenting — den gör bara att felet syns
      # på den gren där det spelar roll, i stället för att gömma sig på
      # grannen. En riktig grind kräver att deployen görs beroende av jobbet,
      # och det är ett annat beslut än det här.
      #
      # Kostnaden är att en main-ändring kör Verify två gånger, eftersom samma
      # commit pushas till båda grenarna. Det är avsiktligt betalt.
      - railway-main

# Jobben läser bara koden (checkout och git fetch); ingenting skrivs tillbaka.
permissions:
  contents: read

jobs:
  # Hemlighetsskanning i CI (2026-11-18). GitHubs egen hemlighetsskanning och
  # push-skydd stängdes av när repot blev privat: gratisplanen har dem bara för
  # publika repon. gitleaks skannar BARA de nya commitarna i en PR eller push,
  # inte historiken: historiken bär kända gamla lösenord (bytas av ägaren) och
  # skulle annars fälla varje körning. Värden maskeras i utskriften (--redact).
  hemligheter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks på nya commits
        env:
          BAS: ${{ github.event.pull_request.base.sha || github.event.before }}
          TOPP: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          curl -sSfL -o /tmp/gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          if [ -z "${BAS}" ] || [ "${BAS}" = "0000000000000000000000000000000000000000" ]; then
            INTERVALL="${TOPP}~1..${TOPP}"
          else
            INTERVALL="${BAS}..${TOPP}"
          fi
          echo "Skannar ${INTERVALL}"
          # --verbose visar fil, rad, regel och commit per träff, så att en
          # träff går att åtgärda utan att köra om skanningen lokalt. Värdena
          # är fortfarande maskerade (--redact).
          /tmp/gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --verbose --log-opts="${INTERVALL}"

  python-tests:
    name: pytest (snajp-support)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: snajp-support/requirements.txt

      - name: Install dependencies
        working-directory: snajp-support
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: snajp-support
        run: pytest

  databas:
    # Raderingslogik får inte gå ut otestad, och minneslagret som resten av
    # sviten kör mot gallrar inte. Det här jobbet reser HELA migrationskedjan
    # från noll mot en tom Postgres (samma huvudversion som driften, 17, med
    # pgvector som 002 kräver), på samma sätt som scripts/lokal_stack.py gör
    # lokalt, och kör databastesterna mot den. Databasen är syntetisk och dör
    # med jobbet; inga hemligheter, ingen riktig miljö.
    name: databastester (Postgres 17, hela migrationskedjan)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Jobbet läser bara koden; tokenen får inte mer än så.
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: railway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Lösenorden är lokal_stack.py:s öppna engångsvärden, inga hemligheter.
      LOKAL_DSN: postgresql://postgres:localdev@127.0.0.1:5432/railway
      GALLRING_TEST_DSN: postgresql://postgres:localdev@127.0.0.1:5432/railway
      GALLRING_TEST_APP_DSN: postgresql://snajp_app:localapp@127.0.0.1:5432/railway
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: snajp-support/requirements.txt

      - name: Install dependencies
        run: pip install -r snajp-support/requirements.txt psycopg2-binary

      - name: Res migrationskedjan från noll
        # lokal_stack.kor_kedjan: railway_migrate.planned() i ordning
        # (railway/000_auth_compat.sql först), approllernas lösenord och
        # NULLIF-kontrollen av tenant-policyerna. Faller på första migrationen
        # som inte går att applicera och säger vilken.
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); import lokal_stack; sys.exit(1 if lokal_stack.kor_kedjan() else 0)"

      - name: Gallringen mot databasen
        working-directory: snajp-support
        run: pytest tests/db/test_gallring.py -v -rs -s

      - name: Tenantisoleringen (RLS) och rättighetsskriptet mot databasen
        # INV-SEC-001 som snajp_app mot det migrerade schemat, och en
        # provkörning av scripts/gdpr_radera.py (sök, registerutdrag och
        # radering) med en syntetisk person. Ett överhoppat test räknas som
        # fel här: utan databasen bevisar de ingenting (2026-11-18).
        working-directory: snajp-support
        env:
          DATABASE_URL: postgresql://postgres:localdev@127.0.0.1:5432/railway
        run: |
          set -o pipefail
          pytest tests/db/test_rls_isolation.py tests/db/test_gdpr_radera_db.py -v -rs | tee /tmp/db-ut.txt
          if grep -qE "[0-9]+ skipped" /tmp/db-ut.txt; then echo "::error::ett databastest hoppades över"; exit 1; fi

  invariants:
    name: Architecture invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # INV-SKILL-006 nedan kör `git diff origin/<bas>...HEAD`. Tre punkter
          # betyder "sedan den gemensamma förfadern", vilket kräver att basen
          # FINNS i den lokala historiken.
          #
          # actions/checkout hämtar som standard EN commit. Den efterföljande
          # `--depth=50`-fetchen ger 50 commits av basgrenen, men ingen historik
          # för HEAD — så någon gemensam förfader går inte att beräkna, och
          # steget föll med `fatal: origin/main...HEAD: no merge base` på VARJE
          # pull request. Att `push`-körningarna var gröna dolde det: steget kör
          # bara på pull_request, så den enda gången det utvärderades var den
          # gången det fällde.
          #
          # 0 = full historik. Alternativet vore ett djupare --depth, men varje
          # sådan siffra är en gissning om hur långt grenarna hunnit divergera,
          # och den gissningen blir fel exakt när den behöver stämma.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: snajp-support/requirements.txt

      - name: Install dependencies
        run: pip install -r snajp-support/requirements.txt

      - name: Print active waivers
        run: cat waivers.yml

      - name: Run invariant tests
        run: pytest tests/invariants

      - name: INV-SKILL-006 — vendor-bump deklarerad
        # Bara på pull requests: kräver en jämförelsereferens, och på en push
        # till development finns ingen meningsfull bas att diffa mot.
        if: github.event_name == 'pull_request'
        run: |
          # Ingen --depth här: checkouten ovan hämtar full historik, och en grund
          # fetch skulle återinföra exakt det som gjorde steget rött.
          git fetch --no-tags origin "${{ github.base_ref }}"
          python scripts/check_vendor_bump.py --base "origin/${{ github.base_ref }}"

  docker-smoke:
    name: agent-core laddas i den byggda imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Hämta basimagen från en spegel
        # public.ecr.aws svarar 429 "Data limit exceeded" på GitHubs delade
        # runners (2026-10-21 till 10-24: tre körningar i rad på PR #39). Samma
        # officiella image hämtas från Googles spegel, med Docker Hub som
        # reserv, och märks med namnet Dockerfilen använder. Bygget hittar den
        # då lokalt och frågar aldrig ECR. Railways byggare berörs inte.
        run: |
          BAS=public.ecr.aws/docker/library/python:3.12-slim
          for kalla in mirror.gcr.io/library/python:3.12-slim docker.io/library/python:3.12-slim; do
            if docker pull "$kalla"; then docker tag "$kalla" "$BAS"; exit 0; fi
          done
          echo "Ingen spegel svarade; bygget hämtar från ECR som förut."

      - name: Bygg imagen från repo-roten
        # Byggkontexten ÄR repo-roten (punkten sist). agent-core/ ligger
        # utanför snajp-support/ och kan inte COPY:as annars.
        run: docker build -f snajp-support/Dockerfile -t snajp-smoke .

      - name: Importera en playbook inuti containern
        # Starkaste enradiga beviset som finns: PlaybookStep.__post_init__
        # anropar parse_skill_name, så själva importen kastar om någon av de
        # fyra skillsen saknas på disk. Ett textpåstående om Dockerfilens
        # innehåll hade inte fångat en felaktig rootDir.
        run: |
          docker run --rm snajp-smoke python -c "
          from app.agentcore.registry import load_full_skill
          from app.leads.outreach_playbook import OUTREACH_V1
          from app.agent.support_playbook import SUPPORT_V1
          assert len(load_full_skill('mk:cold-email')) > 1000
          assert len(OUTREACH_V1.steps) == 4
          assert len(SUPPORT_V1.steps) > 0
          print('agent-core OK i containern')"

      - name: Driftavbilden (synk och migrationer hos Railway)
        # railway/Dockerfile.drift, docs/compliance/synkflytt-plan.md steg 4.
        # Ingen databas och inga hemligheter: avbilden ska bygga, skripten ska
        # gå att starta, kedjan ska finnas på disk, och startkommandot ska
        # vägra utan jobb och i fel miljö.
        run: |
          set -eu
          docker build -f railway/Dockerfile.drift -t snajp-drift .
          docker run --rm snajp-drift python scripts/railway_synk.py --help
          docker run --rm snajp-drift python scripts/railway_migrate.py --help
          docker run --rm snajp-drift python -c "
          import sys; sys.path.insert(0, 'scripts')
          import railway_migrate as rm
          p = rm.planned()
          assert p[0][1].is_file() and len(p) > 100, len(p)
          assert any(v.endswith('_122_synk_lasroll') for v, _ in p)
          print(len(p), 'migrationer i avbilden')"
          if docker run --rm snajp-drift; then echo "::error::startkommandot utan jobb kördes"; exit 1; fi
          if docker run --rm -e RAILWAY_ENVIRONMENT_NAME=development snajp-drift python scripts/railway_drift.py synk; then
            echo "::error::synken startade i development"; exit 1
          fi
          echo "driftavbilden OK"

  type-check:
    name: npm run type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run type-check
