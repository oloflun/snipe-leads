name: Verify

# ETT JOBB, INTE ÅTTA (2026-11-23). Repot är privat sedan 2026-11-18 och har
# gratisplanens 2 000 Actions-minuter i månaden. GitHub avrundar varje JOBB
# uppåt till hel minut, och de åtta jobben som stod här (hemligheter,
# dödmanskontroll, pytest, licenser, databas, invarianter, docker-smoke,
# type-check) tog runt fem minuter tillsammans men kostade nio, eftersom vart
# och ett checkade ut, installerade Python-beroendena och avrundades för sig.
# Taket nåddes 2026-11-23 06:47 och GitHub slutade starta jobb (räknat jobb
# för jobb: 2 108 av novembers 2 989 minuter var Verify). Nu är det ett jobb
# med samma kontroller som steg. Varje kontroll körs även om en tidigare
# fallit (`!cancelled()`), så att ett rött testfel inte döljer ett rött
# licensbeslut, och stegets namn visar vilken som föll.
#
# Det här är DETEKTION, inte en grind: Railway bygger på push och väntar inte
# på GitHub Actions, så en röd Verify stoppar ingenting. Den gör felet synligt
# på grenen där det spelar roll.
on:
  pull_request:
  push:
    branches:
      - development
      - main
      # railway-main är pensionerad (CLAUDE.md) och struken 2026-11-23.

# En ny push till samma pull request avbryter den förra körningen: en PR
# skannas alltid från basen, så inget går förlorat. Pushar avbryts ALDRIG,
# eftersom hemlighetsskanningen bara läser varje pushs egna commits; en
# avbruten push-körning skulle lämna dess commits oskannade. Gruppen är därför
# commitens sha för push (unik, ingen kö) och PR:ens ref för pull_request.
concurrency:
  group: verify-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    # En pull request vars huvudgren själv körs på push (development → main,
    # release-PR:en) prövas redan av push-körningen på samma commit, och
    # GitHub visar den på PR:en. Den andra körningen var ren dubbelkostnad.
    if: github.event_name != 'pull_request' || (github.head_ref != 'development' && github.head_ref != 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # write: säkerhetsbevakningens reserv startar flödet (workflow_dispatch).
      actions: write
      issues: write
    services:
      # Databastesterna: hela migrationskedjan från noll mot en tom Postgres
      # (samma huvudversion som driften, 17, med pgvector som 002 kräver).
      # Syntetisk, dör med jobbet; inga hemligheter, ingen riktig miljö.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: railway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full historik: gitleaks läser ett commitintervall och INV-SKILL-006
          # kör `git diff origin/<bas>...HEAD`, som kräver en gemensam förfader.
          # actions/checkout hämtar annars EN commit, och steget föll då med
          # `fatal: origin/main...HEAD: no merge base` på varje pull request.
          fetch-depth: 0
          persist-credentials: false

      - name: Vilka commits och filer körningen gäller
        id: omfang
        env:
          BAS: ${{ github.event.pull_request.base.sha || github.event.before }}
          TOPP: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          if [ -z "${BAS}" ] || [ "${BAS}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BAS}^{commit}" 2>/dev/null; then
            INTERVALL="${TOPP}~1..${TOPP}"
          else
            INTERVALL="${BAS}..${TOPP}"
          fi
          echo "intervall=${INTERVALL}" >> "$GITHUB_OUTPUT"
          # Bara dokumentation (docs/ och markdown i roten): hemligheterna
          # skannas, resten hoppas över. Allt annat kör hela kedjan.
          # Går diffen inte att läsa körs allt.
          if FILER=$(git diff --name-only "${INTERVALL/../...}") && [ -n "${FILER}" ] \
             && ! printf '%s\n' "${FILER}" | grep -qvE '^(docs/|[^/]+\.md$)'; then
            echo "kod=false" >> "$GITHUB_OUTPUT"; echo "Bara dokumentation i ${INTERVALL}: hemligheterna skannas, resten hoppas över."
          else
            echo "kod=true" >> "$GITHUB_OUTPUT"; echo "Kör alla kontroller (${INTERVALL})."
          fi

      # Hemlighetsskanning (2026-11-18). GitHubs egen hemlighetsskanning och
      # push-skydd stängdes av när repot blev privat. gitleaks skannar BARA de
      # nya commitarna, inte historiken: historiken bär kända gamla lösenord
      # (bytas av ägaren). --verbose visar fil, rad, regel och commit per
      # träff; värdena maskeras (--redact). Körs alltid, också för docs.
      - name: hemligheter (gitleaks på nya commits)
        env:
          INTERVALL: ${{ steps.omfang.outputs.intervall }}
        run: |
          set -eu
          curl -sSfL -o /tmp/gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          echo "Skannar ${INTERVALL}"
          /tmp/gitleaks detect --source . --config .gitleaks.toml --no-banner --redact --verbose --log-opts="${INTERVALL}"

      # Dödmanskontrollerna (2026-11-18). Öppnar ett ärende om övervakningen
      # eller säkerhetsbevakningen inte gått; fäller aldrig CI. Bara när
      # tokenen får skriva ärenden: push, och PR inifrån repot.
      - name: dödman - har övervakningen gått?
        if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # GitHubs övervakning är reserven sedan 2026-11-23: schema var tredje
          # timme, som GitHub ofta tappar (se overvakning.yml). Den egentliga
          # övervakningen går var femtonde minut hos Railway. Gränsen ett
          # dygn larmar när reserven tystnat, inte för varje tappat schema.
          GRANS_SEKUNDER: "86400"
        run: bash scripts/overvakning_dodman.sh
      # Säkerhetsbevakningens reserv (2026-11-23, ersätter workflow_run och
      # grindjobbet i sakerhetsbevakning.yml, som kostade en minut per Verify).
      # Vid push till development: har bevakningen inte lyckats på 20 timmar
      # och står ingen körning i kö startas den. Ett tappat schema missar inget
      # (bevakningen läser sju dagar bakåt och deduplicerar mot ärendena).
      - name: säkerhetsbevakningens reserv
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/development' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if ! alder="$(LAGE=alder FLODE=sakerhetsbevakning.yml bash scripts/overvakning_dodman.sh)" || ! [[ "$alder" =~ ^-?[0-9]+$ ]]; then
            alder=999999
          fi
          if (( alder < 72000 )); then
            echo "Bevakningen lyckades för $((alder / 60)) minuter sedan; ingen reserv behövs."; exit 0
          fi
          koade=$(gh api "repos/${GH_REPO}/actions/workflows/sakerhetsbevakning.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')
          if [ "${koade:-0}" != "0" ]; then echo "En körning står redan i kö."; exit 0; fi
          gh workflow run sakerhetsbevakning.yml --ref development
          echo "Bevakningen startad (senast lyckad för $((alder / 3600)) timmar sedan)."
      - name: dödman - har säkerhetsbevakningen gått?
        if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FLODE: sakerhetsbevakning.yml
        run: bash scripts/overvakning_dodman.sh

      - uses: actions/setup-python@v7
        if: ${{ !cancelled() && steps.omfang.outputs.kod == 'true' }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            snajp-support/requirements.txt
            scripts/requirements-scripts.txt

      # Driftskriptens krav installeras också: de står i licensförteckningen.
      # psycopg2-binary installeras först EFTER licensgrinden, eftersom
      # licenserna läses ur de installerade paketens metadata och grinden ska
      # se samma miljö som förut.
      - name: Installera Python-beroendena
        if: ${{ !cancelled() && steps.omfang.outputs.kod == 'true' }}
        run: pip install -r snajp-support/requirements.txt -r scripts/requirements-scripts.txt

      # Licensgrinden (ISO 27001 A.5.32). Fäller på copyleft och okända
      # licenser som inte står i docs/compliance/licenser-vitlista.json.
      - name: licenser (copyleft-grind)
        if: ${{ !cancelled() && steps.omfang.outputs.kod == 'true' }}
        run: |
          python -m pytest tests/test_licenser.py -q
          python scripts/licenser.py --kontrollera

      - name: pytest (snajp-support)
        if: ${{ !cancelled() && steps.omfang.outputs.kod == 'true' }}
        working-directory: snajp-support
        run: pytest

      - name: Architecture invariants
        if: ${{ !cancelled() && steps.omfang.outputs.kod == 'true' }}
        run: |
          cat waivers.yml
          pytest tests/invariants

      - name: INV-SKILL-006 — vendor-bump deklarerad
        # Bara på pull requests: kräver en jämförelsereferens.
        if: ${{ !cancelled() && steps.omfang.outputs.kod == 'true' && github.event_name == 'pull_request' }}
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python scripts/check_vendor_bump.py --base "origin/${{ github.base_ref }}"

      - name: Compliance-skriptens tester utan databas
        # Rättighetsskriptets tabellkarta (GDPR PR-1, PR-3, PR-4),
        # säkerhetsbevakningens filtrering (A.5.6) och baslinjens maskering (A.8.9).
        if: ${{ !cancelled() && steps.omfang.outputs.kod == 'true' }}
        run: |
          pip install psycopg2-binary
          python -m pytest tests/test_gdpr_radera.py tests/test_sakerhetsbevakning.py tests/test_railway_baslinje.py -q

      # Databasstegen: lösenorden är lokal_stack.py:s öppna engångsvärden.
      # DSN:erna sätts per steg, inte på jobbet, så att pytest-steget ovan
      # inte plockar upp dem och kör databastesterna mot en omigrerad databas.
      - name: databas - res migrationskedjan från noll
        if: ${{ !cancelled() && steps.omfang.outputs.kod == 'true' }}
        env:
          LOKAL_DSN: postgresql://postgres:localdev@127.0.0.1:5432/railway
          GALLRING_TEST_DSN: postgresql://postgres:localdev@127.0.0.1:5432/railway
          GALLRING_TEST_APP_DSN: postgresql://snajp_app:localapp@127.0.0.1:5432/railway
          GALLRING_TEST_WEB_DSN: postgresql://snajp_web:localweb@127.0.0.1:5432/railway
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); import lokal_stack; sys.exit(1 if lokal_stack.kor_kedjan() else 0)"

      - name: databas - gallringen
        if: ${{ !cancelled() && steps.omfang.outputs.kod == 'true' }}
        working-directory: snajp-support
        env:
          LOKAL_DSN: postgresql://postgres:localdev@127.0.0.1:5432/railway
          GALLRING_TEST_DSN: postgresql://postgres:localdev@127.0.0.1:5432/railway
          GALLRING_TEST_APP_DSN: postgresql://snajp_app:localapp@127.0.0.1:5432/railway
          GALLRING_TEST_WEB_DSN: postgresql://snajp_web:localweb@127.0.0.1:5432/railway
        run: pytest tests/db/test_gallring.py -v -rs -s

      - name: databas - tenantisolering, rättighetsskriptet, åtkomstlogg, inloggning, roller, demo, tvåsteg, CRM-lagret
        # Ett överhoppat test räknas som fel: utan databasen bevisar de ingenting.
        if: ${{ !cancelled() && steps.omfang.outputs.kod == 'true' }}
        working-directory: snajp-support
        env:
          LOKAL_DSN: postgresql://postgres:localdev@127.0.0.1:5432/railway
          GALLRING_TEST_DSN: postgresql://postgres:localdev@127.0.0.1:5432/railway
          GALLRING_TEST_APP_DSN: postgresql://snajp_app:localapp@127.0.0.1:5432/railway
          GALLRING_TEST_WEB_DSN: postgresql://snajp_web:localweb@127.0.0.1:5432/railway
          DATABASE_URL: postgresql://postgres:localdev@127.0.0.1:5432/railway
        run: |
          set -o pipefail
          pytest tests/db/test_rls_isolation.py tests/db/test_gdpr_radera_db.py tests/db/test_adminlogg.py tests/db/test_inloggningsforsok.py tests/db/test_snajp_web_rattigheter.py tests/db/test_demo_markering.py tests/db/test_tvafaktor.py tests/db/test_kb_forslag_atomisk.py tests/db/test_plattformsarenden_db.py tests/db/test_demorattningar_db.py tests/db/test_crm_lagring.py -v -rs | tee /tmp/db-ut.txt
          if grep -qE "[0-9]+ skipped" /tmp/db-ut.txt; then echo "::error::ett databastest hoppades över"; exit 1; fi

      - uses: actions/setup-node@v7
        if: ${{ !cancelled() && steps.omfang.outputs.kod == 'true' }}
        with:
          node-version: 20
          cache: npm

      - name: npm run type-check
        if: ${{ !cancelled() && steps.omfang.outputs.kod == 'true' }}
        run: |
          npm ci
          npm run type-check

      - name: docker - agent-core laddas i den byggda imagen
        if: ${{ !cancelled() && steps.omfang.outputs.kod == 'true' }}
        # Basimagen hämtas från en spegel: public.ecr.aws svarar 429 på
        # GitHubs delade runners (2026-10-21 till 10-24). Byggkontexten ÄR
        # repo-roten, eftersom agent-core/ ligger utanför snajp-support/.
        # Importen av playbookerna kastar om någon skill saknas på disk.
        run: |
          set -eu
          BAS=public.ecr.aws/docker/library/python:3.12-slim
          for kalla in mirror.gcr.io/library/python:3.12-slim docker.io/library/python:3.12-slim; do
            if docker pull "$kalla"; then docker tag "$kalla" "$BAS"; break; fi
          done
          docker build -f snajp-support/Dockerfile -t snajp-smoke .
          docker run --rm snajp-smoke python -c "
          from app.agentcore.registry import load_full_skill
          from app.leads.outreach_playbook import OUTREACH_V1
          from app.agent.support_playbook import SUPPORT_V1
          assert len(load_full_skill('mk:cold-email')) > 1000
          assert len(OUTREACH_V1.steps) == 4
          assert len(SUPPORT_V1.steps) > 0
          print('agent-core OK i containern')"

      - name: docker - driftavbilden (synk, migrationer och övervakning hos Railway)
        # railway/Dockerfile.drift. Avbilden ska bygga, skripten ska gå att
        # starta, kedjan ska finnas på disk, och startkommandot ska vägra utan
        # jobb och i fel miljö.
        if: ${{ !cancelled() && steps.omfang.outputs.kod == 'true' }}
        run: |
          set -eu
          docker build -f railway/Dockerfile.drift -t snajp-drift .
          docker run --rm snajp-drift python scripts/railway_synk.py --help
          docker run --rm snajp-drift python scripts/railway_migrate.py --help
          docker run --rm snajp-drift python -c "
          import sys; sys.path.insert(0, 'scripts')
          import railway_migrate as rm
          p = rm.planned()
          assert p[0][1].is_file() and len(p) > 100, len(p)
          assert any(v.endswith('_122_synk_lasroll') for v, _ in p)
          print(len(p), 'migrationer i avbilden')"
          if docker run --rm snajp-drift; then echo "::error::startkommandot utan jobb kördes"; exit 1; fi
          if docker run --rm -e RAILWAY_ENVIRONMENT_NAME=development snajp-drift python scripts/railway_drift.py synk; then
            echo "::error::synken startade i development"; exit 1
          fi
          echo "driftavbilden OK"
