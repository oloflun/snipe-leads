name: Verify

on:
  pull_request:
  push:
    branches:
      # Arbetsgrenarna.
      - development
      - main
      # DEPLOYGRENEN för produktion. Development deployar sedan 2026-08-27
      # direkt från grenen development (Railways trigger omlagd, se DEPLOY.md),
      # så railway-development är död och borttagen ur listan 2026-08-29.
      # railway-main är däremot fortfarande den gren produktionen byggs från,
      # och den ska stå kvar här tills main-cutovern är gjord.
      #
      # Historiken som motiverar raden: 2026-08-24 deployade fyra commits i
      # rad medan Verify var rött, eftersom rödheten satt på en gren som ingen
      # deploy läste. Bokföringschattens tur två var trasig i drift med grön
      # dev-maskin.
      #
      # LÄS DET HÄR INNAN DU LITAR PÅ DEN: det här är DETEKTION, inte en
      # grind. Railway bygger på push och väntar inte på GitHub Actions, så en
      # röd Verify stoppar fortfarande ingenting — den gör bara att felet syns
      # på den gren där det spelar roll, i stället för att gömma sig på
      # grannen. En riktig grind kräver att deployen görs beroende av jobbet,
      # och det är ett annat beslut än det här.
      #
      # Kostnaden är att en main-ändring kör Verify två gånger, eftersom samma
      # commit pushas till båda grenarna. Det är avsiktligt betalt.
      - railway-main

jobs:
  python-tests:
    name: pytest (snajp-support)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: snajp-support/requirements.txt

      - name: Install dependencies
        working-directory: snajp-support
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: snajp-support
        run: pytest

  invariants:
    name: Architecture invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # INV-SKILL-006 nedan kör `git diff origin/<bas>...HEAD`. Tre punkter
          # betyder "sedan den gemensamma förfadern", vilket kräver att basen
          # FINNS i den lokala historiken.
          #
          # actions/checkout hämtar som standard EN commit. Den efterföljande
          # `--depth=50`-fetchen ger 50 commits av basgrenen, men ingen historik
          # för HEAD — så någon gemensam förfader går inte att beräkna, och
          # steget föll med `fatal: origin/main...HEAD: no merge base` på VARJE
          # pull request. Att `push`-körningarna var gröna dolde det: steget kör
          # bara på pull_request, så den enda gången det utvärderades var den
          # gången det fällde.
          #
          # 0 = full historik. Alternativet vore ett djupare --depth, men varje
          # sådan siffra är en gissning om hur långt grenarna hunnit divergera,
          # och den gissningen blir fel exakt när den behöver stämma.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: snajp-support/requirements.txt

      - name: Install dependencies
        run: pip install -r snajp-support/requirements.txt

      - name: Print active waivers
        run: cat waivers.yml

      - name: Run invariant tests
        run: pytest tests/invariants

      - name: INV-SKILL-006 — vendor-bump deklarerad
        # Bara på pull requests: kräver en jämförelsereferens, och på en push
        # till development finns ingen meningsfull bas att diffa mot.
        if: github.event_name == 'pull_request'
        run: |
          # Ingen --depth här: checkouten ovan hämtar full historik, och en grund
          # fetch skulle återinföra exakt det som gjorde steget rött.
          git fetch --no-tags origin "${{ github.base_ref }}"
          python scripts/check_vendor_bump.py --base "origin/${{ github.base_ref }}"

  docker-smoke:
    name: agent-core laddas i den byggda imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bygg imagen från repo-roten
        # Byggkontexten ÄR repo-roten (punkten sist). agent-core/ ligger
        # utanför snajp-support/ och kan inte COPY:as annars.
        run: docker build -f snajp-support/Dockerfile -t snajp-smoke .

      - name: Importera en playbook inuti containern
        # Starkaste enradiga beviset som finns: PlaybookStep.__post_init__
        # anropar parse_skill_name, så själva importen kastar om någon av de
        # fyra skillsen saknas på disk. Ett textpåstående om Dockerfilens
        # innehåll hade inte fångat en felaktig rootDir.
        run: |
          docker run --rm snajp-smoke python -c "
          from app.agentcore.registry import load_full_skill
          from app.leads.outreach_playbook import OUTREACH_V1
          from app.agent.support_playbook import SUPPORT_V1
          assert len(load_full_skill('mk:cold-email')) > 1000
          assert len(OUTREACH_V1.steps) == 4
          assert len(SUPPORT_V1.steps) > 0
          print('agent-core OK i containern')"

  type-check:
    name: npm run type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run type-check
