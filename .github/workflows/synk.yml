# Synk av körningar och supportärenden mellan development och main (Anton
# 2026-10-17, docs/BESLUT.md). Första synken (för hand, --apply --forsta) för
# över allt från development; därefter speglar den main → development var
# tionde minut, och körningar gjorda i development flyttas med Byt kund →
# Flytta till main. Provkörningar synkas aldrig. pipefail nedan: 2026-10-04
# avbröt jobbet medan det stod grönt (tee dolde felkoden).
#
# Skriptet vägrar tills första synken gjorts och när schemaversionerna skiljer sig.
#
# Fönsterlöst per definition: körs på GitHubs runner, inte på en lokal maskin.
name: synk

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: synk
  cancel-in-progress: false

jobs:
  synk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install psycopg2-binary
      # Skriptet läser .env.deploy (RAILWAY_MAIN_PG_* och RAILWAY_DEVELOPMENT_PG_*).
      # Repo-hemligheten ENV_DEPLOY är filens innehåll; den skrivs aldrig ut.
      - name: Skriv .env.deploy ur hemligheten
        run: printf '%s\n' "$ENV_DEPLOY" > .env.deploy
        env:
          ENV_DEPLOY: ${{ secrets.ENV_DEPLOY }}
      - name: Synka
        shell: bash
        run: |
          set -o pipefail
          python scripts/railway_synk.py --apply | tee synk.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synk-${{ github.run_id }}
          path: synk.log
          retention-days: 14
