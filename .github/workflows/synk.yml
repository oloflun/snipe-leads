# Synk av körningar och supportärenden mellan development och main (Anton
# 2026-10-17, docs/BESLUT.md). Första synken (för hand, --apply --forsta) för
# över allt från development; därefter speglar den main → development var
# tionde minut, och körningar gjorda i development flyttas med Byt kund →
# Flytta till main. Provkörningar synkas aldrig. pipefail nedan: 2026-10-04
# avbröt jobbet medan det stod grönt (tee dolde felkoden).
#
# Skriptet vägrar tills första synken gjorts och när main ligger före
# development i schemat. Development får ligga före main (2026-11-16): en
# migration som väntar på nästa release stoppar inte längre synken.
#
# Fönsterlöst per definition: körs på GitHubs runner, inte på en lokal maskin.
name: synk

# Schemat är borttaget 2026-11-23: synken körs hos Railway (tjänsten `synk` i
# miljön main, var tionde minut; DEPLOY.md "Driftjobben körs hos Railway").
# Den manuella starten står kvar som reserv (synkflytt-runbook.md, steg 8).
on:
  workflow_dispatch:

concurrency:
  group: synk
  cancel-in-progress: false

# GITHUB_TOKEN behövs bara för checkout. Databaserna nås med hemligheterna
# nedan, och upload-artifact använder körningens egen token, inte GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  synk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install psycopg2-binary
      # Skriptet behöver bara sex värden: RAILWAY_MAIN_PG_{PASSWORD,HOST,PORT}
      # och RAILWAY_DEVELOPMENT_PG_{PASSWORD,HOST,PORT} (railway_migrate.dsn,
      # som läser miljön när .env.deploy saknas). De läses ur sex smala
      # repo-hemligheter med samma namn (synkflytt-plan.md, smala hemligheter).
      # Saknas någon av dem skrivs .env.deploy ur den breda hemligheten
      # ENV_DEPLOY som förut, så att inget går sönder före ägarens handgrepp.
      # Hemligheterna finns bara i det här steget och skrivs aldrig ut.
      - name: Synka
        shell: bash
        env:
          ENV_DEPLOY: ${{ secrets.ENV_DEPLOY }}
          RAILWAY_MAIN_PG_PASSWORD: ${{ secrets.RAILWAY_MAIN_PG_PASSWORD }}
          RAILWAY_MAIN_PG_HOST: ${{ secrets.RAILWAY_MAIN_PG_HOST }}
          RAILWAY_MAIN_PG_PORT: ${{ secrets.RAILWAY_MAIN_PG_PORT }}
          RAILWAY_DEVELOPMENT_PG_PASSWORD: ${{ secrets.RAILWAY_DEVELOPMENT_PG_PASSWORD }}
          RAILWAY_DEVELOPMENT_PG_HOST: ${{ secrets.RAILWAY_DEVELOPMENT_PG_HOST }}
          RAILWAY_DEVELOPMENT_PG_PORT: ${{ secrets.RAILWAY_DEVELOPMENT_PG_PORT }}
        run: |
          set -o pipefail
          if [ -n "$RAILWAY_MAIN_PG_PASSWORD" ] && [ -n "$RAILWAY_MAIN_PG_HOST" ] && [ -n "$RAILWAY_MAIN_PG_PORT" ] \
            && [ -n "$RAILWAY_DEVELOPMENT_PG_PASSWORD" ] && [ -n "$RAILWAY_DEVELOPMENT_PG_HOST" ] && [ -n "$RAILWAY_DEVELOPMENT_PG_PORT" ]; then
            echo "Anslutningarna: de smala hemligheterna."
          else
            echo "Anslutningarna: ENV_DEPLOY (de smala hemligheterna saknas)."
            printf '%s\n' "$ENV_DEPLOY" > .env.deploy
          fi
          unset ENV_DEPLOY
          python scripts/railway_synk.py --apply | tee synk.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synk-${{ github.run_id }}
          path: synk.log
          retention-days: 14
