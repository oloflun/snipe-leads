# Tvåvägssynk av körningar och supportärenden, development ⇄ main (Anton
# 2026-10-10, docs/BESLUT.md). Ersätter den nattliga envägsspegeln main →
# development (spegla-dev, railway_seed_dev.py), som tömde development varje
# natt och sedan 2026-10-04 avbröt på schemaskillnaden medan jobbet stod grönt
# (tee dolde felkoden; därför pipefail nedan).
#
# Skriptet vägrar tills första synken gjorts för hand (--apply --forsta), och
# vägrar när schemaversionerna skiljer sig. Provkörningar synkas aldrig; de
# flyttas till main med Byt kund → Flytta till main.
#
# Fönsterlöst per definition: körs på GitHubs runner, inte på en lokal maskin.
name: synk

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: synk
  cancel-in-progress: false

jobs:
  synk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install psycopg2-binary
      # Skriptet läser .env.deploy (RAILWAY_MAIN_PG_* och RAILWAY_DEVELOPMENT_PG_*).
      # Repo-hemligheten ENV_DEPLOY är filens innehåll; den skrivs aldrig ut.
      - name: Skriv .env.deploy ur hemligheten
        run: printf '%s\n' "$ENV_DEPLOY" > .env.deploy
        env:
          ENV_DEPLOY: ${{ secrets.ENV_DEPLOY }}
      - name: Synka
        shell: bash
        run: |
          set -o pipefail
          python scripts/railway_synk.py --apply | tee synk.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synk-${{ github.run_id }}
          path: synk.log
          retention-days: 14
