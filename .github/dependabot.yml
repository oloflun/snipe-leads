# Beroendeuppdateringar (ISO 27001-genomgången 2026-11-18).
#
# DEPENDABOT ÖPPNAR INGA EGNA PULL REQUESTS (Anton 2026-11-23: "se till att
# den inte öppnar egna"). Taket open-pull-requests-limit är 0 i varje
# ekosystem, och repots automatiska säkerhetsuppdateringar är avstängda
# (`gh api -X DELETE repos/oloflun/snipe-leads/automated-security-fixes`).
# Skälet: repot är privat sedan 2026-11-18 och har gratisplanens 2 000
# Actions-minuter i månaden. Varje Dependabot-PR kostade ett eget bygge plus
# en hel Verify per push, och sju sådana PR:er öppnades samma måndag.
#
# Det som finns kvar: sårbarhetslarmen (vulnerability alerts) är på, och
# säkerhetsbevakningen (.github/workflows/sakerhetsbevakning.yml) läser
# GitHubs advisories mot stacken och skriver ärenden. Uppdateringarna görs
# för hand på development och följer med release-PR:en till main, på samma
# sätt som de sju Dependabot-PR:erna samlades i PR 105.
#
# Konfigurationen nedan står kvar så att grupper och mål är givna den dag
# taket höjs igen. Höj då ett ekosystem i taget.
#
# Repots bumpgrind (INV-SKILL-006, scripts/check_vendor_bump.py i verify.yml)
# gäller bara agent-core/skills/**. Där finns inga manifest, så Dependabots
# pull requests berörs inte av grinden. De går genom samma Verify som allt
# annat (invarianter, pytest, docker-smoke, type-check) och mergas för hand.
#
# Inte med: marknad/video (fristående Remotion-projekt som aldrig byggs i
# tjänsterna, se .dockerignore).
version: 2

updates:
  # Webben (Next.js, Railway-tjänsten web) och agentsajten (support-webb/,
  # Railway-tjänsten support).
  - package-ecosystem: npm
    directories:
      - "/"
      - "/support-webb"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Stockholm
    target-branch: development
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(beroenden)"
    groups:
      npm-mindre:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-sakerhet:
        applies-to: security-updates
        update-types: [minor, patch]

  # Backenden (snajp-support/requirements.txt) och driftskripten
  # (scripts/requirements-scripts.txt). Taken i requirements.txt (t.ex.
  # openai-agents <0.23) är medvetna: Dependabot föreslår inget utanför dem
  # utan att ändra raden, och en sådan pull request är ett beslut.
  - package-ecosystem: pip
    directories:
      - "/snajp-support"
      - "/scripts"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Stockholm
    target-branch: development
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(beroenden)"
    groups:
      pip-mindre:
        applies-to: version-updates
        update-types: [minor, patch]
      pip-sakerhet:
        applies-to: security-updates
        update-types: [minor, patch]

  # Actions som workflows använder (actions/checkout, setup-python …).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Stockholm
    target-branch: development
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(beroenden)"
    groups:
      actions:
        patterns: ["*"]

  # api-tjänstens image. Python-versionen (3.12) hänger ihop med CI
  # (setup-python 3.12) och med docker-smoke i verify.yml, som hämtar just
  # python:3.12-slim från en spegel. Ett byte av minorversion är därför ett
  # beslut för alla tre ställena samtidigt och föreslås inte här.
  - package-ecosystem: docker
    directory: "/snajp-support"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Stockholm
    target-branch: development
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(beroenden)"
    ignore:
      - dependency-name: "*python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
